[package]
name = "befikr-spike"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# Kotlin loads this by name (plugins/tauri-plugin-reminders/.../Native.kt).
name = "befikr_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-reminders = { path = "../plugins/tauri-plugin-reminders" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
jni = "0.21"
