<!-- Cold-start splash (Nuxt spaLoadingTemplate). plugins/splash.client.ts lifts it out
     of Nuxt's loader so it stays up until the first screen has its data (useSplash).
     Background = befikr_window (Android) = --bg. Icon: src-tauri/android/icon. -->
<script>
  // Saved theme (Settings → Theme) before anything paints.
  try {
    const t = localStorage.getItem('befikr.theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  } catch {}
</script>
<div id="splash">
  <style>
    #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
      background: #e2e5ea; color: #111; font: 600 22px/1 system-ui, Roboto, sans-serif; letter-spacing: -0.01em; }
    #splash svg { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 28px rgb(0 0 0 / 12%);
      animation: splash-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #splash span { animation: splash-in 0.5s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #splash .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #splash { background: #0e0e0e; color: #fafafa; }
      :root:not([data-theme="light"]) #splash .light { display: none; }
      :root:not([data-theme="light"]) #splash .dark { display: block; }
    }
    :root[data-theme="dark"] #splash { background: #0e0e0e; color: #fafafa; }
    :root[data-theme="dark"] #splash .light { display: none; }
    :root[data-theme="dark"] #splash .dark { display: block; }
    /* Leaving (composables/useSplash.ts): fades and opens up as the page rises in behind. */
    #splash { z-index: 1000; transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
    #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    @keyframes splash-in { from { opacity: 0; transform: translateY(6px) scale(0.96); } }
  </style>
