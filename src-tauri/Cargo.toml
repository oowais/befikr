[package]
name = "befikr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Kotlin loads this by name (plugins/tauri-plugin-reminders/.../Native.kt).
name = "befikr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
befikr-core = { path = "../crates/core" }
befikr-sync = { path = "../crates/sync" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-reminders = { path = "../plugins/tauri-plugin-reminders" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
jni = "0.21"
# Timeout for background sync (JNI `syncOnce`).
tokio = { version = "1", features = ["time"] }

# Desktop: reminders scheduler, tray, single instance, start at login.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# File and folder pickers for backups.
tauri-plugin-dialog = "2"
# In-app updates (used on Windows; see desktop/update.rs).
tauri-plugin-updater = "2"
# This computer's time zone for the morning digest ("today" is local).
iana-time-zone = "0.1"

# Window app id (`com.befikr.app`, see `run`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Reminder notifications with Complete / Snooze buttons (D-Bus on Linux, toasts on Windows).
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
notify-rust = "4"
