[package]
name = "befikr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Kotlin loads this by name (plugins/tauri-plugin-reminders/.../Native.kt).
name = "befikr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
befikr-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-reminders = { path = "../plugins/tauri-plugin-reminders" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-tz = "0.10"
jni = "0.21"
