[package]
name = "befikr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Kotlin loads this by name (plugins/tauri-plugin-reminders/.../Native.kt).
name = "befikr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
befikr-core = { path = "../crates/core" }
befikr-sync = { path = "../crates/sync" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-reminders = { path = "../plugins/tauri-plugin-reminders" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-tz = "0.10"
jni = "0.21"

# Desktop: reminders scheduler, tray, single instance, start at login.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Reminder notifications with Complete / Snooze buttons (D-Bus on Linux, toasts on Windows).
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
notify-rust = "4"
