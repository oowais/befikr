[package]
name = "befikr-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Storage, recurrence and reminder logic. No Tauri dependency: called from Tauri commands and from Kotlin via JNI."

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v7"] }
