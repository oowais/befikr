name: parser

on:
  push:
    paths: ["packages/parser/**", ".github/workflows/parser.yml"]
  pull_request:
    paths: ["packages/parser/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parser
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/parser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Time-zone independence
        run: TZ=Pacific/Auckland npx vitest run && TZ=America/Los_Angeles npx vitest run
