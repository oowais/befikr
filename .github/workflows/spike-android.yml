name: spike-android

on:
  push:
    paths: ["spike/**", ".github/workflows/spike-android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spike/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri android init --ci

      - run: pnpm tauri android build --debug --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: befikr-spike-apk
          path: spike/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
