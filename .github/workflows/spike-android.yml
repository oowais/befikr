name: spike-android

on:
  push:
    paths: ["spike/**", ".github/workflows/spike-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner image ships Android SDK + NDK (ANDROID_HOME, ANDROID_NDK_LATEST_HOME).
      - name: Use preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_NDK_LATEST_HOME" | head

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spike/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri android init --ci

      - run: pnpm tauri android build --debug --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: befikr-spike-apk
          path: spike/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Phone-friendly download: Releases → "Spike APK (latest)".
      - name: Rename APK
        run: cp "$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)" befikr-spike.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: spike-latest
          name: Spike APK (latest)
          body: "Step 0 spike, debug build of ${{ github.sha }}. Install on an arm64 Android 8+ phone. Test protocol: spike/README.md"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: spike/befikr-spike.apk
