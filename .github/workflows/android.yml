name: android

on:
  push:
    paths:
      - "app/**"
      - "src-tauri/**"
      - "crates/**"
      - "plugins/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "nuxt.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every build is a new version (0.1.<run>): Discoverium/Obtainium detect
      # it as an update and Android's versionCode increases with it.
      - name: Version from run number
        run: |
          V="0.1.${{ github.run_number }}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner image ships Android SDK + NDK (ANDROID_HOME, ANDROID_NDK_LATEST_HOME).
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri android init --ci

      # App icon (adaptive + night + monochrome) and notification icon.
      # Source: src-tauri/android/icon/gen.py
      - name: Apply Android resources
        run: cp -r src-tauri/android/res/. src-tauri/gen/android/app/src/main/res/

      - run: pnpm tauri android build --apk --target aarch64 --ci

      # Same key every build so updates install over the previous version.
      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks src-tauri/android/sideload.jks --ks-pass pass:befikr-sideload \
            --ks-key-alias befikr --out befikr.apk aligned.apk
          "$BT/apksigner" verify befikr.apk
          ls -la befikr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: befikr-apk
          path: befikr.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Befikr ${{ env.VERSION }}
          body: "Build of ${{ github.ref_name }} @ ${{ github.sha }}. Arm64, Android 8+. Installs over the previous version."
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: befikr.apk
