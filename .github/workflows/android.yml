name: android

# Builds and releases the APK only after a merge to main (or by hand); the
# desktop packages (Linux .deb + Arch PKGBUILD, Windows installer) build
# alongside and are attached to the same release. PRs get lint and tests only
# (core.yml, web.yml).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src-tauri/**"
      - "crates/**"
      - "plugins/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "nuxt.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
      - "packaging/**"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a release

# One build per branch at a time: a queued main build computes its version
# only after the previous release has tagged.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 (Android SDK/NDK come from the image)
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for the version bump

      # Semver 0.x.y from Conventional Commits (.github/scripts/next-version.sh).
      # Android versionCode derives from it, so every release is an update.
      - name: Version
        id: version
        run: |
          V=$(.github/scripts/next-version.sh)
          R=true
          if [ "$V" = none ]; then
            V=$(git describe --tags --abbrev=0 --match 'v0.*'); V=${V#v}
            R=false
          fi
          echo "RELEASE=$R" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # For the desktop-release job.
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Version $V"
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json
          .github/scripts/release-notes.sh > release-notes.md
          cat release-notes.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner image ships Android SDK + NDK (ANDROID_HOME, ANDROID_NDK_LATEST_HOME).
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri android init --ci

      # App icon (adaptive + night + monochrome) and notification icon.
      # Source: src-tauri/android/icon/gen.py
      - name: Apply Android resources
        run: cp -r src-tauri/android/res/. src-tauri/gen/android/app/src/main/res/

      - run: pnpm tauri android build --apk --target aarch64 --ci

      # Same key every build so updates install over the previous version.
      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks src-tauri/android/sideload.jks --ks-pass pass:befikr-sideload \
            --ks-key-alias befikr --out befikr.apk aligned.apk
          "$BT/apksigner" verify befikr.apk
          ls -la befikr.apk

      - uses: actions/upload-artifact@v7
        with:
          name: befikr-${{ env.VERSION }}-apk
          path: befikr.apk

      # Only main publishes; a manual run on another branch just uploads the artifact.
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' && env.RELEASE == 'true'
        with:
          tag_name: v${{ env.VERSION }}
          name: Befikr ${{ env.VERSION }}
          body_path: release-notes.md
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: befikr.apk

  # Linux: the .deb, and the Arch PKGBUILD that repackages it
  # (scripts/install-arch.sh installs it; the AUR befikr-bin would be the same).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/desktop-version.sh
      - name: Tauri build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb --ci
      - name: Package
        run: |
          DEB="befikr_${VERSION}_amd64.deb"
          cp target/release/bundle/deb/*.deb "$DEB"
          SHA=$(sha256sum "$DEB" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" packaging/arch/PKGBUILD.in > PKGBUILD
          ls -la "$DEB" PKGBUILD
      - uses: actions/upload-artifact@v7
        with:
          name: befikr-${{ env.VERSION }}-linux
          path: |
            befikr_*_amd64.deb
            PKGBUILD

  # Windows: the NSIS installer (unsigned, so SmartScreen asks once).
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: .github/scripts/desktop-version.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # With the updater key set (repo secrets), the installer is also signed
      # for in-app updates and latest.json (the updater's manifest) is made.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --bundles nsis --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: no in-app update for this release"
            pnpm tauri build --bundles nsis --ci
          fi
      - name: Package
        run: |
          EXE="befikr_${VERSION}_x64-setup.exe"
          cp target/release/bundle/nsis/*-setup.exe "$EXE"
          ls -la "$EXE"
          SIG=$(ls target/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -1)
          if [ -n "$SIG" ]; then
            jq -n --arg v "$VERSION" --arg sig "$(cat "$SIG")" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${EXE}" \
              '{version: $v, pub_date: (now | todate), platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
            cat latest.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: befikr-${{ env.VERSION }}-windows
          path: |
            befikr_*_x64-setup.exe
            latest.json

  # After the APK job has created the release: add the desktop files to it.
  desktop-release:
    needs: [apk, linux, windows]
    if: github.ref == 'refs/heads/main' && needs.apk.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: befikr-${{ needs.apk.outputs.version }}-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          files: |
            befikr_*_amd64.deb
            PKGBUILD
            befikr_*_x64-setup.exe
            latest.json
