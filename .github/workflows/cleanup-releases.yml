# One-off: remove the pre-semver prereleases. Deleted right after it runs.
name: cleanup-releases
on:
  push:
    paths: [".github/workflows/cleanup-releases.yml"]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in spike-latest befikr-latest; do
            gh release delete "$tag" --cleanup-tag --yes --repo "${{ github.repository }}" || echo "no $tag"
          done
          gh release list --repo "${{ github.repository }}"
