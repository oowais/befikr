name: web

# Parser tests, Nuxt build + typecheck: on PRs, and on main after a merge.
on:
  push:
    branches: [main]
    paths: ["app/**", "packages/**", "package.json", "pnpm-lock.yaml", "nuxt.config.ts", ".github/workflows/web.yml"]
  pull_request:
    paths: ["app/**", "packages/**", "package.json", "pnpm-lock.yaml", "nuxt.config.ts", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @befikr/parser typecheck
      - run: pnpm --filter @befikr/parser test
      - name: Parser is time-zone independent
        working-directory: packages/parser
        run: TZ=Pacific/Auckland npx vitest run && TZ=America/Los_Angeles npx vitest run
      - run: pnpm generate
      - run: pnpm typecheck
